[project]
name = "capi-blog"
version = "0.1.0"
description = "Blog Info Capibaribe"
authors = [
    {name = "henriquecapi",email = "henriquecapi@hotmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard] (>=0.44.0,<0.45.0)",
    "python-multipart (>=0.0.26,<0.0.27)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "databases[aiosqlite] (>=0.9.0,<0.10.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
