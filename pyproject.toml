[project]
name = "capi-blog"
version = "0.1.0"
description = "Blog Info Capibaribe"
authors = [
    {name = "henriquecapi",email = "henriquecapi@hotmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard] (>=0.44.0,<0.45.0)",
    "python-multipart (>=0.0.26,<0.0.27)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "databases[aiosqlite] (>=0.9.0,<0.10.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]
 
[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 80

[tool.pyrefly]
python_interpreter = "C:\\Users\\henri\\AppData\\Local\\pypoetry\\Cache\\virtualenvs\\capi-blog-ESUKy2CM-py3.13\\Scripts\\python.exe"
source_directories = ["src"]

